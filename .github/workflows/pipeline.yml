name: Spring Boot CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java
        run: java -version

      - name: Maven Build
        run: mvn clean package

      - name: Find Trivy
        shell: powershell
        run: |
          Get-Command trivy -ErrorAction SilentlyContinue
          Get-ChildItem "$env:LOCALAPPDATA\Microsoft\WinGet\Packages" -Recurse -Filter trivy.exe

      - name: Trivy File System Scan
        shell: powershell
        run: |
          $trivy = (Get-ChildItem "$env:LOCALAPPDATA\Microsoft\WinGet\Packages" -Recurse -Filter trivy.exe | Select-Object -First 1).FullName
          if (-not $trivy) {
            throw "Trivy executable not found."
          }
          & $trivy fs .

      - name: Build Docker Image
        run: docker build -t springboot-cicd .

      - name: Verify Docker Image
        run: docker images

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Tag Docker Image
        run: docker tag springboot-cicd ${{ secrets.DOCKER_USERNAME }}/springboot-cicd:latest

      - name: Push Docker Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/springboot-cicd:latest